% Laminar, steady, incompressible SU2 case template (Plan Section 6/7/12).
%
% This deliberately diverges from mikfoil's bundled "incompressible.cfg", which
% defaults to SOLVER=INC_RANS with an SST turbulence closure — appropriate for
% AirfRANS-regime Re (2-6M) but NOT for this project's laminar training regime
% (Re ~ 1e4-1e5, Plan Section 6). Using SOLVER=INC_NAVIER_STOKES here (no
% turbulence model) keeps the CFD ground truth consistent with the same laminar
% incompressible Navier-Stokes equations the PINN's physics loss enforces
% (Plan Section 7) — training against RANS-closure CFD while the loss assumes
% laminar NS would be a silent physics mismatch.
%
% Rendered via Jinja2 by mikfoil (mikfoil.su2.config_generation), with `case`
% (a mikfoil.case.Case) and `math` available in the template namespace.

% ------------- GENERAL SETUP ------------%
SOLVER= INC_NAVIER_STOKES
MATH_PROBLEM= DIRECT

% ------------------------- FREE-STREAM DEFINITION ----------------------------%
% INC_ solvers read the freestream direction/magnitude from INC_VELOCITY_INIT, NOT
% from FREESTREAM_VELOCITY (that keyword is for the compressible solver family and
% is silently ignored here) — this was the root cause of a CL~=0 bug found during
% Week 1 smoke testing: AoA was correctly rotated into FREESTREAM_VELOCITY but never
% actually reached the flow, for a symmetric airfoil at nonzero AoA. Kept both set
% (FREESTREAM_VELOCITY harmless if unused) rather than relying on solver-specific
% silent fallback behavior.
FREESTREAM_DENSITY= 1.225
{% set velocity = case.mach * 340.29 %}
{% set vel_x = velocity * math.cos(math.radians(case.aoa)) %}
% Sign: the airfoil geometry/mesh is NOT rotated (AoA is applied purely by rotating
% the inflow, in the airfoil's own fixed frame with +y = upper surface). Positive AoA
% (nose-up relative to the wind) means the apparent inflow, expressed in that fixed
% frame, comes from slightly BELOW the chord line — a negative y-component — not
% positive. Verified empirically: +vel_y gave negative CL for positive AoA on a
% symmetric airfoil (backwards); -vel_y gives the correct sign (Week 1 smoke test).
{% set vel_y = -velocity * math.sin(math.radians(case.aoa)) %}
FREESTREAM_VELOCITY= ( {{ "%.6f"|format(vel_x) }}, {{ "%.6f"|format(vel_y) }}, 0.00 )
INC_DENSITY_INIT= 1.225
INC_VELOCITY_INIT= ( {{ "%.6f"|format(vel_x) }}, {{ "%.6f"|format(vel_y) }}, 0.00 )
INC_TEMPERATURE_INIT= 288.15
INC_NONDIM= DIMENSIONAL
VISCOSITY_MODEL= CONSTANT_VISCOSITY
{% if case.reynolds > 0 %}
{% set mu = (1.225 * velocity * 1.0) / case.reynolds %}
MU_CONSTANT= {{ "%.6e"|format(mu) }}
{% else %}
MU_CONSTANT= 1.7894E-5
{% endif %}

% ------------------------- REFERENCE VALUE DEFINITION ------------------------%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% ----------------------- BOUNDARY CONDITION DEFINITION -----------------------%
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% ------------------------ NUMERICAL METHOD DEFINITION ------------------------%
CONV_NUM_METHOD_FLOW= FDS
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
MUSCL_FLOW= YES

% --------------------------- LINEAR SOLVER DEFINITION ------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU

% --------------------------- TIME-MARCHING PARAMETERS ------------------------%
TIME_DOMAIN= NO
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 1.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.15, 1.0, 1000.0 )

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
% Dual criterion (residual drop AND Cauchy convergence on CL/CD), per Plan
% Section 12 step 4 — either alone is a known false-convergence trap.
ITER= 3000
CONV_FIELD= (LIFT, DRAG)
CONV_STARTITER= 200
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-5
CONV_RESIDUAL_MINVAL= -8

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_PARAVIEW)
RESTART_SOL= {% if case.restart %}YES{% else %}NO{% endif %}
SOLUTION_FILENAME= restart.dat
RESTART_FILENAME= restart.dat
VOLUME_OUTPUT= (COORDINATES, SOLUTION, PRIMITIVE)
CONV_FILENAME= history
SURFACE_FILENAME= surface
VOLUME_FILENAME= volume
HISTORY_OUTPUT= (ITER, LIFT, DRAG, MOMENT_Z, RES_RMS_DENS)
